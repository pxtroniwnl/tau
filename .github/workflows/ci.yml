name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - run: uv run lint-imports
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Generated artifacts must be up to date (reproducibility).
  contract:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
      - run: uv sync --locked
      - run: uv run python -m tau.api.openapi
      - run: git diff --exit-code

  trace:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
      - run: uv sync --locked
      - run: uv run python -m tau.tools.check_trace

  # Documentation duty (AGENTS.md): code/data/config changes need a CHANGELOG entry.
  changelog:
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'no-changelog')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require CHANGELOG.md when non-doc files change
        run: |
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          relevant=$(echo "$changed" | grep -vE '^(docs/|\.github/)|\.md$' || true)
          if [ -n "$relevant" ] && ! echo "$changed" | grep -qx 'CHANGELOG.md'; then
            echo "::error::Non-doc files changed but CHANGELOG.md was not updated (see AGENTS.md). Add the 'no-changelog' label only for changes with no visible effect."
            echo "$relevant"
            exit 1
          fi
