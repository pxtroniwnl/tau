name: Data correction
description: A catalog value is wrong or outdated
labels: [data]
body:
  - type: input
    id: object
    attributes:
      label: Object and field (e.g. "Cygnus X-1 · mass_msun")
    validations:
      required: true
  - type: input
    id: value
    attributes:
      label: Correct value with its uncertainty
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Primary source (DOI or arXiv)
      description: Required. Nothing changes without a source.
    validations:
      required: true
